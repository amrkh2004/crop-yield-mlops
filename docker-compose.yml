version: '3.8'

services:
  prodml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodml_crop_yield_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models/model.pkl
      - ENV=production
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - monitoring-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prodml_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: prodml_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  monitoring-net:
    driver: bridge
