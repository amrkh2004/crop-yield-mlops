version: '3.8'

services:
  prodml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodml_crop_yield_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models/model.pkl
      - ENV=production
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - monitoring-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prodml-api-canary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodml_crop_yield_api_canary
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models/model.pkl
      - ENV=canary
    volumes:
      - ./models:/app/models
    networks:
      - monitoring-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - prodml-api
      - prodml-api-canary
    networks:
      - monitoring-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prodml_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    networks:
      - monitoring-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: prodml_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio_dvc_remote
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - monitoring-net
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: minio_create_bucket
    depends_on:
      - minio
    networks:
      - monitoring-net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/dvcstore --ignore-existing;
      /usr/bin/mc anonymous set download myminio/dvcstore;
      exit 0;
      "

networks:
  monitoring-net:
    driver: bridge
