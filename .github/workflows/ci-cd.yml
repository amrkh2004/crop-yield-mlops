name: CI/CD Pipeline

on:
  push:
    branches: [ main, module-1-packaging, module-2-tracking-automation, module-3-deployment-serving, module-4-optimization-benchmarking, module-5-monitoring-drift ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality Gate & Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Code Quality Gate (Ruff Linting)
        run: |
          ruff check src scripts tests

      - name: Code Formatting Check (Black)
        run: |
          black --check src scripts tests

      - name: Run Pytest Suite with Coverage Enforcement
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  docker-build-push:
    name: Docker Build & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: amrkh2004/crop-yield-mlops
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
