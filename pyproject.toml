[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prodml"
version = "0.1.0"
description = "Crop Yield Prediction ML Service & API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ML Ops Team", email = "admin@example.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=23.1.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.2.0",
    "onnxruntime>=1.15.0",
    "skl2onnx>=1.14.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]
